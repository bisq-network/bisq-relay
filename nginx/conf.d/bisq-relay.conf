# /etc/nginx/conf.d/bisq-relay.conf
#
# Host nginx config for bisq-relay.
#
# Shared request policy lives in /etc/nginx/bisq-relay/*.conf.
# This file only defines host-specific networking.

include /etc/nginx/bisq-relay/bisq-relay-http.conf;

upstream relay_app {
    server 127.0.0.1:8081;
    keepalive 16;
}

server {
    listen 127.0.0.1:8080 default_server;
    server_name _;

    include /etc/nginx/bisq-relay/bisq-relay-server-locations.conf;
}
