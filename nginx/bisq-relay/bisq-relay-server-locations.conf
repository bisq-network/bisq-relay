access_log /var/log/nginx/bisq-relay-access.log relay_sanitized;
error_log  /var/log/nginx/bisq-relay-error.log warn;

server_tokens off;

# Push payloads should be small. This blocks large body abuse.
client_max_body_size 32k;

# Protect from slow or truncated request bodies.
client_header_timeout 5s;
client_body_timeout 5s;
keepalive_timeout 10s;

# Return 429 for rate-limited requests once dry-run is disabled.
limit_req_status 429;

# Emit rate-limit diagnostics below the error log's configured threshold.
# Rate-limit outcomes remain visible in the sanitized access log through
# $limit_req_status, without exposing device tokens in request paths.
limit_req_log_level info;

# Set to "on" to run in dry-run mode to observe rate-limit behavior without rejecting requests.
limit_req_dry_run off;

# Block obvious traversal probes.
location ~* "(\.\.|%2e%2e|%252e%252e|/proc/self/environ|/root/\.env|\.env)" {
    return 400;
}

proxy_request_buffering on;
proxy_http_version 1.1;

proxy_set_header Host $host;
proxy_set_header X-Forwarded-Proto http;

# Do not forward client-IP headers to the app.
# Tor deployments only expose the local Tor daemon address, and clearnet
# deployments may expose spoofed, proxied, or privacy-sensitive client IPs.
proxy_set_header X-Real-IP "";
proxy_set_header X-Forwarded-For "";

proxy_connect_timeout 3s;
proxy_send_timeout 10s;
proxy_read_timeout 30s;

# ---------------------------------------------------------------------------
# APNs endpoint with token in the URL path.
# ---------------------------------------------------------------------------
location ~ "^/v1/apns/device/[^/]{20,1024}$" {
    if ($request_method != POST) {
        return 405;
    }

    if ($content_type !~* "^application/json($|;)") {
        return 415;
    }

    # Generous global circuit breaker.
    limit_req zone=relay_global burst=300 nodelay;

    # Targeted per-device-token limiter.
    limit_req zone=relay_per_device burst=5 nodelay;

    proxy_pass http://relay_app;
}

# ---------------------------------------------------------------------------
# FCM endpoint with token in the URL path.
# ---------------------------------------------------------------------------
location ~ "^/v1/fcm/device/[^/]{20,1024}$" {
    if ($request_method != POST) {
        return 405;
    }

    if ($content_type !~* "^application/json($|;)") {
        return 415;
    }

    # Generous global circuit breaker.
    limit_req zone=relay_global burst=300 nodelay;

    # Targeted per-device-token limiter.
    limit_req zone=relay_per_device burst=5 nodelay;

    proxy_pass http://relay_app;
}

# ---------------------------------------------------------------------------
# APNs endpoint with token in the JSON body.
# ---------------------------------------------------------------------------
location = /v1/apns {
    if ($request_method != POST) {
        return 405;
    }

    if ($content_type !~* "^application/json($|;)") {
        return 415;
    }

    # Only the generous global circuit breaker applies here.
    # Token-aware throttling should move into the application once tokens
    # are no longer present in the URL.
    limit_req zone=relay_global burst=300 nodelay;

    proxy_pass http://relay_app;
}

# ---------------------------------------------------------------------------
# FCM endpoint with token in the JSON body.
# ---------------------------------------------------------------------------
location = /v1/fcm {
    if ($request_method != POST) {
        return 405;
    }

    if ($content_type !~* "^application/json($|;)") {
        return 415;
    }

    # Only the generous global circuit breaker applies here.
    limit_req zone=relay_global burst=300 nodelay;

    proxy_pass http://relay_app;
}

# ---------------------------------------------------------------------------
# Legacy endpoint.
#
# /relay uses query parameters including token/msg. The sanitized log format
# above intentionally avoids logging the URI or query string.
# ---------------------------------------------------------------------------
location = /relay {
    if ($request_method != GET) {
        return 405;
    }

    # Generous global circuit breaker.
    limit_req zone=relay_global burst=300 nodelay;

    # Targeted per-token limiter for legacy clients.
    limit_req zone=relay_legacy_per_token burst=5 nodelay;

    proxy_pass http://relay_app;
}

# Everything else never reaches the application.
location / {
    return 404;
}
