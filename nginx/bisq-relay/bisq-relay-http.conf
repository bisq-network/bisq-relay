# Shared http-level nginx policy for bisq-relay.
#
# Include this from nginx's http context before the deployment-specific server
# block.

# ---------------------------------------------------------------------------
# Sanitized logging
# ---------------------------------------------------------------------------
#
# Do not log $request, $request_uri, $uri, or $args while device tokens may
# appear in URL paths or query parameters.
# Instead, map sensitive URLs to coarse route labels and log only those labels.
map $uri $relay_route {
    default "unknown";

    ~^/v1/apns/device/ "v1_apns_device_token";
    ~^/v1/fcm/device/  "v1_fcm_device_token";

    =/v1/apns "v1_apns";
    =/v1/fcm  "v1_fcm";

    =/relay   "legacy_relay";
}

log_format relay_sanitized
    '$remote_addr - $remote_user [$time_local] '
    '"$request_method $relay_route $server_protocol" '
    '$status $body_bytes_sent '
    'limit_req=$limit_req_status '
    '"$http_referer" "$http_user_agent"';

# ---------------------------------------------------------------------------
# Rate limiting
# ---------------------------------------------------------------------------

# Generous server-wide emergency circuit breaker.
# Do not key this by $remote_addr: Tor deployments usually see the local Tor
# daemon address, and clearnet deployments may sit behind shared proxies.
# Keep this generous because it affects all clients for this server.
limit_req_zone $server_name zone=relay_global:10m rate=100r/s;

# Per-device-token limiter for token-in-path endpoints.
# /v1/apns/device/{token} and /v1/fcm/device/{token}
map $uri $relay_device_key {
    default "";
    ~^/v1/apns/device/([^/]+)$ $1;
    ~^/v1/fcm/device/([^/]+)$ $1;
}
limit_req_zone $relay_device_key zone=relay_per_device:10m rate=2r/s;

# Per-token limiter for the legacy /relay endpoint.
# The token is passed as a query parameter on /relay. Do not log it.
map $arg_token $relay_legacy_token_key {
    default $arg_token;
    "" "";
}
limit_req_zone $relay_legacy_token_key zone=relay_legacy_per_token:10m rate=2r/s;
