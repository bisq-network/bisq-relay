services:
  relay-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: bisq-relay:local
    container_name: relay-app
    expose:
      - "8081"   # application traffic for nginx
      - "9400"   # management/actuator traffic for Prometheus
    ports:
      - "127.0.0.1:9400:9400"   # local host access to actuator
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:9400/actuator/health" ]
      interval: 10s
      timeout: 3s
      retries: 10
    environment:
      SERVER_ADDRESS: "0.0.0.0"
      MANAGEMENT_SERVER_ADDRESS: "0.0.0.0"
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    container_name: relay-nginx
    volumes:
      - ./docker/nginx/bisq-relay.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/bisq-relay:/etc/nginx/bisq-relay:ro
    ports:
      - "127.0.0.1:8080:8080"   # local host entry point for application traffic
    depends_on:
      relay-app:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        sed "s|localhost|relay-app|g" /tmp/prometheus.yaml > /etc/prometheus/prometheus.yaml &&
        exec /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yaml \
          --storage.tsdb.retention.time=7d \
          --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yaml:/tmp/prometheus.yaml:ro
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "admin"
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        mkdir -p /etc/grafana/provisioning/datasources &&
        sed "s|localhost|prometheus|g" /tmp/datasources.yaml > /etc/grafana/provisioning/datasources/datasources.yaml &&
        /run.sh
    volumes:
      - ./monitoring/grafana/provisioning/datasources/datasources.yaml:/tmp/datasources.yaml:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
