# Docker nginx config for bisq-relay.
#
# Shared request policy lives in /etc/nginx/bisq-relay/*.conf.
# This file only defines Docker-specific networking.

include /etc/nginx/bisq-relay/bisq-relay-http.conf;

upstream relay_app {
    server relay-app:8081;
    keepalive 16;
}

server {
    listen 8080 default_server;
    server_name _;

    include /etc/nginx/bisq-relay/bisq-relay-server-locations.conf;
}
